# Publishes the web / iPhone version to GitHub Pages whenever a release is published (or on demand).
name: Web app

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # --ignore-scripts: skip downloading Electron, the web build doesn't need it
      - run: npm ci --ignore-scripts
      - run: npm run build-web
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web-dist
      - id: deployment
        uses: actions/deploy-pages@v4
