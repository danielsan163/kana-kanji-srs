<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:">
  <title>Kana Kanji SRS</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <div class="brand" data-go="dashboard"><span class="brand-mark">字</span> Kana Kanji SRS</div>
    <nav>
      <button data-go="dashboard">Dashboard</button>
      <button data-go="lessons">Lessons <span class="badge" id="nav-lessons">0</span></button>
      <button data-go="reviews">Reviews <span class="badge" id="nav-reviews">0</span></button>
      <button data-go="browse">Browse</button>
      <button data-go="settings">Settings</button>
    </nav>
    <div class="level-pill" id="nav-level">Level 1</div>
  </header>
  <main id="view"></main>
  <div id="modal" class="modal hidden"><div class="modal-card" id="modal-card"></div></div>
  <div id="toast" class="toast hidden"></div>

  <script src="data/data.js"></script>
  <script src="js/kana.js"></script>
  <script src="js/srs.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
